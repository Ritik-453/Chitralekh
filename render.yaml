services:
  # Backend API (FastAPI)
  - type: web
    name: chitralekh-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        fromDatabase:
          name: chitralekh-db
          property: connectionString

  # Frontend (React 18 + Vite)
  - type: web
    name: chitralekh-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Managed PostgreSQL Database (Free Tier)
  - name: chitralekh-db
    databaseName: chitralekh
    user: chitralekh_user
    plan: free
